    <script>
        const canvas = document.getElementById('koreanWhiteCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initNodes();
        });

        const mouse = { x: width * 0.5, y: height * 0.4, isHovered: false, radius: 220 };
        window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.isHovered = true; });
        window.addEventListener('mouseleave', () => { mouse.isHovered = false; });

        let nodes = [];

        class ContrastNode {
            constructor(isPrimary = false, isSecondary = false) {
                this.isPrimary = isPrimary;
                this.isSecondary = isSecondary;
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.14;
                this.vy = (Math.random() - 0.5) * 0.14;

                if (this.isPrimary) {
                    this.r = 44; // Vòng Thái cực lớn bề thế như ảnh bạn chụp
                    this.baseAlpha = 0.88;
                    this.rotSpeed = 0.0008;
                } else if (this.isSecondary) {
                    this.r = 16;
                    this.baseAlpha = 0.7;
                    this.rotSpeed = (Math.random() - 0.5) * 0.003;
                } else {
                    this.r = Math.random() > 0.8 ? 5 : (Math.random() * 2 + 1.2);
                    this.baseAlpha = Math.random() * 0.35 + 0.3;
                    this.rotSpeed = 0.002;
                }

                this.alpha = this.baseAlpha;
                this.pulseSpeed = Math.random() * 0.02 + 0.01;
                this.pulseAngle = Math.random() * Math.PI * 2;
                this.rotation = Math.random() * Math.PI * 2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.rotation += this.rotSpeed;

                this.pulseAngle += this.pulseSpeed;
                this.alpha = this.baseAlpha + Math.sin(this.pulseAngle) * 0.12;

                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (mouse.isHovered && dist < mouse.radius) {
                    const force = (mouse.radius - dist) / mouse.radius;
                    this.alpha = Math.min(1, this.baseAlpha + force * 0.35);
                    this.x -= (dx / dist) * force * 0.5;
                    this.y -= (dy / dist) * force * 0.5;
                }

                const pad = this.r * 2 + 30;
                if (this.x < -pad) this.x = width + pad;
                if (this.x > width + pad) this.x = -pad;
                if (this.y < -pad) this.y = height + pad;
                if (this.y > height + pad) this.y = -pad;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                if (this.isPrimary) {
                    // THÁI CỰC VÀNG ĐỒNG NỔI BẬT Y HỆT ẢNH BẠN VỪA TEST
                    const r = this.r;
                    ctx.shadowColor = 'rgba(184, 134, 11, 0.35)';
                    ctx.shadowBlur = 16;

                    ctx.strokeStyle = `rgba(184, 134, 11, ${this.alpha * 0.9})`;
                    ctx.lineWidth = 1.8;
                    ctx.beginPath();
                    ctx.arc(0, 0, r, 0, Math.PI * 2);
                    ctx.stroke();

                    const grad = ctx.createLinearGradient(-r, -r, r, r);
                    grad.addColorStop(0, `rgba(197, 160, 89, ${this.alpha * 0.85})`);
                    grad.addColorStop(1, `rgba(161, 124, 47, ${this.alpha * 0.95})`);
                    ctx.fillStyle = grad;

                    ctx.beginPath();
                    ctx.arc(0, 0, r, -Math.PI / 2, Math.PI / 2, false);
                    ctx.arc(0, r / 2, r / 2, Math.PI / 2, -Math.PI / 2, true);
                    ctx.arc(0, -r / 2, r / 2, Math.PI / 2, -Math.PI / 2, false);
                    ctx.closePath();
                    ctx.fill();

                    ctx.fillStyle = '#FFFFFF';
                    ctx.beginPath();
                    ctx.arc(0, -r / 2, r * 0.18, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = '#B8860B';
                    ctx.beginPath();
                    ctx.arc(0, r / 2, r * 0.18, 0, Math.PI * 2);
                    ctx.fill();

                } else if (this.isSecondary) {
                    const r = this.r;
                    ctx.shadowColor = 'rgba(184, 134, 11, 0.25)';
                    ctx.shadowBlur = 8;
                    ctx.strokeStyle = `rgba(184, 134, 11, ${this.alpha * 0.9})`;
                    ctx.fillStyle = `rgba(197, 160, 89, ${this.alpha * 0.35})`;
                    ctx.lineWidth = 1.4;

                    ctx.beginPath();
                    for (let i = 0; i < 14; i++) {
                        const rad = i % 2 === 0 ? r : r * 0.5;
                        const a = (i * Math.PI) / 7;
                        const sx = Math.cos(a) * rad, sy = Math.sin(a) * rad;
                        if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
                    }
                    ctx.closePath();
                    ctx.fill(); ctx.stroke();
                } else {
                    ctx.fillStyle = `rgba(184, 134, 11, ${this.alpha * 0.75})`;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.r, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        function initNodes() {
            nodes = [];
            const count = Math.max(12, Math.floor((width * height) / 95000));
            nodes.push(new ContrastNode(true, false));
            nodes.push(new ContrastNode(true, false));
            for (let i = 0; i < 3; i++) nodes.push(new ContrastNode(false, true));
            for (let i = 0; i < count; i++) nodes.push(new ContrastNode(false, false));
        }

        function drawConnections() {
            const maxDistance = 180;
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const p1 = nodes[i], p2 = nodes[j];
                    if (p1.isPrimary || p2.isPrimary) continue;

                    const dx = p1.x - p2.x, dy = p1.y - p2.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < maxDistance) {
                        const alpha = (1 - dist / maxDistance) * 0.22 * Math.min(p1.alpha, p2.alpha);
                        ctx.strokeStyle = `rgba(184, 134, 11, ${alpha})`;
                        ctx.lineWidth = 0.9;
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }

                if (mouse.isHovered) {
                    const p = nodes[i];
                    const dxm = p.x - mouse.x, dym = p.y - mouse.y;
                    const dm = Math.sqrt(dxm * dxm + dym * dym);

                    if (dm < mouse.radius) {
                        const mouseAlpha = (1 - dm / mouse.radius) * 0.35;
                        ctx.strokeStyle = `rgba(184, 134, 11, ${mouseAlpha})`;
                        ctx.lineWidth = 1.1;
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y); ctx.lineTo(mouse.x, mouse.y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            drawConnections();
            for (let i = 0; i < nodes.length; i++) {
                nodes[i].update();
                nodes[i].draw();
            }
            requestAnimationFrame(animate);
        }

        initNodes();
        animate();
